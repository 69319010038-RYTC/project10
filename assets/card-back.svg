<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 210" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Background pastel purple, blue, pink gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8dbfc" />
      <stop offset="50%" stop-color="#d4f0fc" />
      <stop offset="100%" stop-color="#ffd1dc" />
    </linearGradient>
    <!-- Gold gradient for borders and star - softer pastel gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="35%" stop-color="#e6c662" />
      <stop offset="100%" stop-color="#b09138" />
    </linearGradient>
    <!-- Dark gold/purple for shadow/depth -->
    <linearGradient id="darkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a88930" />
      <stop offset="100%" stop-color="#6e4f1a" />
    </linearGradient>
  </defs>

  <!-- Card body -->
  <rect width="150" height="210" rx="12" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner thin gold border -->
  <rect x="8" y="8" width="134" height="194" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.9" />
  <rect x="11" y="11" width="128" height="188" rx="6" fill="none" stroke="url(#goldGrad)" stroke-dasharray="2 3" stroke-width="0.6" opacity="0.7" />

  <!-- Mystic Corner Designs -->
  <!-- Bottom Left & Right corner visual decorations -->
  <path d="M 12 25 L 25 12 M 12 35 L 35 12" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
  <circle cx="20" cy="20" r="1.5" fill="url(#goldGrad)" />
  <path d="M 138 25 L 125 12 M 138 35 L 115 12" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
  <circle cx="130" cy="20" r="1.5" fill="url(#goldGrad)" />
  <path d="M 12 185 L 25 198 M 12 175 L 35 198" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
  <circle cx="20" cy="190" r="1.5" fill="url(#goldGrad)" />
  <path d="M 138 185 L 125 198 M 138 175 L 115 198" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />
  <circle cx="130" cy="190" r="1.5" fill="url(#goldGrad)" />

  <!-- Background starry details -->
  <g fill="url(#goldGrad)" opacity="0.5">
    <circle cx="35" cy="50" r="0.7" />
    <circle cx="115" cy="50" r="0.7" />
    <circle cx="35" cy="160" r="0.7" />
    <circle cx="115" cy="160" r="0.7" />
    <circle cx="25" cy="105" r="0.5" />
    <circle cx="125" cy="105" r="0.5" />
  </g>

  <!-- Central Mystical Circle -->
  <circle cx="75" cy="105" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />
  <circle cx="75" cy="105" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.8" />
  <circle cx="75" cy="105" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5" />

  <!-- Center Celestial Star (8 points) -->
  <g transform="translate(75, 105)">
    <path d="M 0,-30 L 7,-8 L 28,0 L 7,8 L 0,30 L -7,8 L -28,0 L -7,-8 Z" fill="url(#goldGrad)" stroke="url(#darkGoldGrad)" stroke-width="0.5" />
    <path d="M 0,-30 L 7,-8 L 28,0 L 7,8 L 0,30 L -7,8 L -28,0 L -7,-8 Z" fill="url(#goldGrad)" stroke="url(#darkGoldGrad)" stroke-width="0.5" transform="rotate(45)" />
    <circle cx="0" cy="0" r="8" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="0.8" />
    <circle cx="0" cy="0" r="5" fill="url(#goldGrad)" />
    <circle cx="0" cy="-18" r="1.2" fill="url(#goldGrad)" />
    <circle cx="18" cy="0" r="1.2" fill="url(#goldGrad)" />
    <circle cx="0" cy="18" r="1.2" fill="url(#goldGrad)" />
    <circle cx="-18" cy="0" r="1.2" fill="url(#goldGrad)" />
  </g>
</svg>
